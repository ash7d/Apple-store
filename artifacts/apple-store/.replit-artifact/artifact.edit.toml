kind = "web"
previewPath = "/"
title = "Apple Store"
description = "A responsive Apple-products storefront with product discovery, cart, customer accounts, and order history."
version = "1.0.0"
id = "artifacts/apple-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24420

[services.development]
run = "pnpm --filter @workspace/apple-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apple-store", "run", "build" ]
serve = "pnpm --filter @workspace/apple-store run serve"

[services.env]
PORT = "24420"
BASE_PATH = "/"
