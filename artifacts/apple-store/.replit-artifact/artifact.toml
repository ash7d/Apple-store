kind = "web"
previewPath = "/"
title = "Apple Store"
description = "A Next.js storefront for Apple products with MongoDB-backed products and customer accounts."
version = "1.0.0"
id = "artifacts/apple-store"
router = "path"
[[services]]
name = "web"
paths = ["/", "/_next/hmr"]
localPort = 24420
[services.development]
run = "pnpm --filter @workspace/apple-store run dev"
[services.production.build]
args = ["pnpm", "--filter", "@workspace/apple-store", "run", "build"]
[services.production.run]
args = ["pnpm", "--filter", "@workspace/apple-store", "run", "serve"]
[services.production.run.env]
PORT = "24420"
NODE_ENV = "production"
[services.env]
PORT = "24420"
BASE_PATH = "/"
