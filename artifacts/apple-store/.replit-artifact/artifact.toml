kind = "web"
previewPath = "/"
title = "Apple Store"
description = "A responsive storefront for Apple products, with product discovery, search and filtering, product details, and a working cart."
version = "1.0.0"
id = "artifacts/apple-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24420

[services.development]
run = "pnpm --filter @workspace/apple-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apple-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/apple-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24420"
BASE_PATH = "/"
